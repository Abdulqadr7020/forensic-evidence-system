<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForenCrypt Logo Animation</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000000;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .canvas {
        position: relative;
        width: 1920px;
        height: 1080px;
        max-width: 100%;
        max-height: 100vh;
        aspect-ratio: 16 / 9;
        background-color: #000000;
    }

    svg {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
    }
    
    .silver-stroke {
        fill: none;
        stroke: #F4F4F5;
        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    /* 0.5s - 1.6s | Shackle Formation */
    .shackle {
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: draw-line 1.1s cubic-bezier(0.4, 0.0, 0.2, 1) 0.5s forwards;
    }

    /* 1.6s - 2.8s | Document Body Construction */
    .doc-body {
        stroke-dasharray: 1400;
        stroke-dashoffset: 1400;
        animation: draw-line 1.2s cubic-bezier(0.4, 0.0, 0.2, 1) 1.6s forwards;
    }

    /* 2.8s - 3.5s | Document Details */
    .doc-line { opacity: 0; }
    .doc-line-1 { animation: fade-in 0.3s ease-out 2.8s forwards; }
    .doc-line-2 { animation: fade-in 0.3s ease-out 3.0s forwards; }
    .doc-line-3 { animation: fade-in 0.3s ease-out 3.2s forwards; }

    /* 3.5s - 4.1s | Teal Completion */
    .teal-corner {
        fill: #20C9B0;
        opacity: 0;
        animation: fade-in 0.6s ease-out 3.5s forwards;
    }

    /* 3.5s - 4.7s | Bolder, Aesthetic Soft-Wipe Reveal */
    .wordmark {
        position: absolute;
        bottom: 16%;
        left: 50%;
        /* Padding left balances the letter-spacing to ensure absolute center */
        padding-left: 14px; 
        transform: translateX(-50%);
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 54px;
        font-weight: 600; /* Made Bolder */
        letter-spacing: 14px;
        color: #F4F4F5;
        
        /* Advanced Soft Left-to-Right Masking */
        background: linear-gradient(90deg, #F4F4F5 0%, #F4F4F5 45%, rgba(244,244,245,0) 55%, rgba(244,244,245,0) 100%);
        background-size: 300% 100%;
        background-position: 100% 0%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        
        opacity: 0;
        animation: 
            drift-up 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 3.5s forwards,
            wipe-text 1.2s cubic-bezier(0.3, 0.0, 0.2, 1) 3.5s forwards;
    }

    /* Keyframes */
    @keyframes draw-line {
        to { stroke-dashoffset: 0; }
    }
    
    @keyframes fade-in {
        to { opacity: 1; }
    }

    @keyframes drift-up {
        from { opacity: 0; bottom: 14%; }
        to { opacity: 1; bottom: 16%; }
    }

    @keyframes wipe-text {
        to { background-position: 0% 0%; }
    }
</style>
</head>
<body>
    <div class="canvas">
        <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
            <!-- Document Body Outline -->
            <path class="silver-stroke doc-body" 
                  d="M 820 400 H 1100 V 680 H 1000 V 780 H 820 Z" />
            
            <!-- Padlock Shackle -->
            <path class="silver-stroke shackle" 
                  d="M 880 400 V 320 A 80 80 0 0 1 1040 320 V 400" />
            
            <!-- Three Horizontal Lines -->
            <path class="silver-stroke doc-line doc-line-1" d="M 880 500 H 1040" />
            <path class="silver-stroke doc-line doc-line-2" d="M 880 580 H 1040" />
            <path class="silver-stroke doc-line doc-line-3" d="M 880 660 H 980" />
            
            <!-- Folded Corner (Teal) -->
            <path class="teal-corner" 
                  d="M 1100 680 L 1000 780 V 680 Z" />
        </svg>

        <!-- Upgraded Text Layer -->
        <div class="wordmark">ForenCrypt</div>
    </div>
</body>
</html>
